name: CI/CD Pipeline

on:
  push:
    branches: [main, render-deploy]
  pull_request:
    branches: [main, render-deploy]

jobs:
  # ============================================================================
  # LINT & TYPE CHECK
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KU-Fleet-Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Must match "engines": { "node": "22.x" } in package.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KU-Fleet-Backend/package-lock.json

      # npm ci requires a committed lockfile. It is now tracked (previously the
      # root .gitignore excluded it, which made this step fail every run).
      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  # ============================================================================
  # BUILD + TEST
  # ============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    defaults:
      run:
        working-directory: KU-Fleet-Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KU-Fleet-Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/server.js || { echo "::error::dist/server.js missing"; exit 1; }
          test -f dist/app.js    || { echo "::error::dist/app.js missing"; exit 1; }
          test -f dist/tcp/tcpServer.js || { echo "::error::dist/tcp/tcpServer.js missing"; exit 1; }
          test -f dist/workers/workers.js || { echo "::error::dist/workers/workers.js missing"; exit 1; }
          echo "build artifacts present"

      # Runs `npm run build` first (pretest), then the node:test suites.
      # No database or Redis is required: the Redis/Mongo guards refuse to
      # connect when NODE_ENV=test unless an explicit test URL is provided.
      - name: Run tests
        run: npm test

  # ============================================================================
  # SECURITY SCAN
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: KU-Fleet-Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm audit
        run: npm audit --audit-level=high || true